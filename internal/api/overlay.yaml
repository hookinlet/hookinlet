overlay: 1.0.0
info:
  title: How the generated Go types differ from the published document
  version: 1.0.0
actions:
  # A message body is the JSON the sender posted. Carry it as raw JSON, so that it
  # is neither parsed nor re-encoded on the way out: a number such as
  # 9007199254740993 would not survive being read into a float64.
  - target: $.components.schemas.Message.properties.body
    update:
      x-go-type: json.RawMessage
      x-go-type-skip-optional-pointer: true
  # The MCP endpoint hands JSON-RPC to the MCP SDK and takes its answer as it is:
  # the document describes the messages, and the SDK is what writes them.
  - target: $.components.schemas.JsonRpcRequest
    update:
      x-go-type: json.RawMessage
  - target: $.components.schemas.JsonRpcResponse
    update:
      x-go-type: json.RawMessage
  # The rest of an ingest path may be empty (`/in/key/`), which the document cannot
  # say of a path parameter; the generated code is told, so it does not refuse it.
  - target: $.paths["/in/{key}/{rest}"].*.parameters[?(@.name=="rest")]
    update:
      required: false
  # A reconnecting browser may send an empty Last-Event-ID, which means "none yet".
  # The server reads the header itself; the generated code is told it is text so
  # that it does not refuse the empty one.
  - target: $.paths["/v1/inboxes/{slug}/stream"].get.parameters[?(@.name=="Last-Event-ID")].schema
    update:
      type: string
