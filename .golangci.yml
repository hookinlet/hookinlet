version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - goheader
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # The MIT licensed example clients carry an MIT header instead (examples/LICENSE).
      - path: ^examples/(go-agent/(agent|main)\.go|relay/[a-z_]+\.go)$
        linters:
          - goheader
  settings:
    errcheck:
      # Writes to stdout/stderr have nowhere useful to report a failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Close errors on result sets are reported through rows.Err.
        - (*database/sql.Rows).Close
    goheader:
      # Every source file carries the AGPL-3.0 SPDX header, except the example clients that are
      # MIT licensed (see examples/LICENSE), which carry an MIT one.
      template: |-
        SPDX-License-Identifier: AGPL-3.0-only
        Copyright (C) {{ YEAR }} Pat Ramsey
      values:
        regexp:
          YEAR: '20\d\d'

formatters:
  enable:
    - gofmt
    - goimports
