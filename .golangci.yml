version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - goheader
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/stderr have nowhere useful to report a failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    goheader:
      # Guardrail 11: every source file carries the AGPL-3.0 SPDX header.
      template: |-
        SPDX-License-Identifier: AGPL-3.0-only
        Copyright (C) {{ YEAR }} Pat Ramsey
      values:
        regexp:
          YEAR: '20\d\d'

formatters:
  enable:
    - gofmt
    - goimports
