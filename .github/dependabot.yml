# Keeps the pinned parts up to date: Go modules, the GitHub Actions (pinned by commit,
# which Dependabot updates with their version comments), and the base images in the
# Dockerfile (pinned by digest). A security update opens at once; the rest weekly, grouped,
# so that a week's changes are one pull request to read and CI is the gate.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
  # The console's build tools and runtime. CI rebuilds internal/ui/dist and the licence
  # file from the lockfile and fails on any difference, so a bump of a package that is in
  # the bundle needs a person to run `make web` on the branch and push the result.
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-dependencies:
        patterns: ["*"]
    # TypeScript 7 is the native compiler and has no JavaScript API, which vue-tsc and
    # openapi-typescript need. Stay on 5.x until they support it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
