name: CI

# A pull request gets the fast checks: build, vet, the unit tests, lint, and the
# static checks on the OpenAPI document and the generated code. Everything that
# starts a server, builds an image, or builds a release runs when a change lands on
# main and every night (a tag runs the release workflow, which does the release
# checks itself), so it is never skipped, only moved off the critical path of a
# review.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: The generated API code matches docs/openapi.json, and generating is deterministic
        run: |
          go generate ./internal/api
          git diff --exit-code -- internal/api || { echo "::error::internal/api is out of date; run make generate and commit the result"; exit 1; }
          test -z "$(git status --porcelain -- internal/api)"
          # A second run must change nothing, byte for byte.
          sha256sum internal/api/api.gen.go > /tmp/first.sha
          go generate ./internal/api
          sha256sum -c /tmp/first.sha
      # The race detector doubles the time and is for main, not for every push to a
      # review.
      - name: Test (everything but pkg/server, which has its own job)
        run: go test ${{ github.event_name == 'pull_request' && '' || '-race' }} $(go list ./... | grep -v '/pkg/server$')

  # pkg/server has several hundred tests that run one after another and takes as
  # long as all the rest together, so it runs alongside them, not after them.
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test pkg/server
        run: go test ${{ github.event_name == 'pull_request' && '' || '-race' }} ./pkg/server/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t hookinlet:ci .
      - name: Smoke test the image
        run: scripts/smoke-docker.sh hookinlet:ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image also builds for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  # The documentation is code too: its examples must run, and the OpenAPI
  # document must be valid (a Go test also checks it against the server).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Starts servers and runs the examples against them: not for a review.
      - name: Run the examples in the documentation
        if: github.event_name != 'pull_request'
        run: scripts/test-docs.sh
      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@2.62.1 lint docs/openapi.json

  # A release is only worth tagging if it would work, so check it on every change.
  release-config:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install syft (for the SBOMs)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: check
      - name: Build the archives, checksums, and SBOMs (nothing is published)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean
      - name: Check the archive contents
        run: |
          set -e
          cd dist
          sha256sum -c checksums.txt
          ls *.sbom.json | wc -l | grep -qx 4
          for a in hookinlet_*_linux_amd64.tar.gz; do tar -tzf "$a" | grep -qx hookinlet; done
