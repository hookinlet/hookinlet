name: CI

# A pull request gets the fast checks: build, vet, the unit tests, lint, the static
# checks on the OpenAPI document and the generated code, the console's build and unit
# tests, and its end-to-end tests in a browser. The heavy ones (the race detector, the
# documentation examples, the image build and the release dry run, about as many
# minutes again) run every night, when someone starts CI by hand (Actions, CI, Run
# workflow), and on a push to main that changed anything they read (not one that only
# edited the changelog or another project document: scripts/ci-heavy.sh decides). A
# release waits for a full run that passed on the tagged commit (see
# docs/releasing.md), so the heavy checks are never skipped before a release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push compares itself with the previous tip of main (see scripts/ci-heavy.sh).
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Do the heavy checks apply to this run?
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/ci-heavy.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Which pushes get the heavy checks (scripts/ci-heavy.sh) still works
        run: scripts/test-ci-heavy.sh
      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: The generated API code matches docs/openapi.json, and generating is deterministic
        run: |
          go generate ./internal/api
          git diff --exit-code -- internal/api || { echo "::error::internal/api is out of date; run make generate and commit the result"; exit 1; }
          test -z "$(git status --porcelain -- internal/api)"
          # A second run must change nothing, byte for byte.
          sha256sum internal/api/api.gen.go > /tmp/first.sha
          go generate ./internal/api
          sha256sum -c /tmp/first.sha
      - name: Our one changed generator template is still upstream's plus the recorded edits
        run: scripts/check-template.sh
      - name: THIRD_PARTY_LICENSES is current, and every dependency has an allowed license
        run: scripts/third-party-licenses.sh --check
      # The race detector doubles the time and is for main, not for every push to a
      # review.
      - name: Test (everything but pkg/server, which has its own job)
        env:
          RACE: ${{ steps.heavy.outputs.heavy }}
        # A test that hangs fails with its goroutines in a few minutes, not after the
        # job's whole budget.
        run: go test -timeout 6m $([ "$RACE" = true ] && echo -race) $(go list ./... | grep -v '/pkg/server$')

  # The admin console (web/) is built from source into internal/ui/dist, which is
  # committed so that `go build` and `go install` need no Node. CI rebuilds it from the
  # lockfile and fails if the committed files differ, as it does for the generated API
  # code, so what is embedded is always what the source builds.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --ignore-scripts: a package's install script never runs here.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: The API types match docs/openapi.json
        run: |
          npm run types
          git diff --exit-code -- src/api || { echo "::error::web/src/api/schema.d.ts is out of date; run npm run types in web/ and commit the result"; exit 1; }
      - name: Unit tests
        run: npm test
      - name: Message content is never rendered as HTML
        run: |
          if grep -rn "v-html\|innerHTML\|insertAdjacentHTML" src; then echo "::error::the console must render senders' content as text only"; exit 1; fi
      - name: Build, and the committed build is what the source builds
        run: |
          npm run build
          git diff --exit-code -- ../internal/ui/dist || { echo "::error::internal/ui/dist is out of date; run npm run build in web/ and commit the result"; exit 1; }
          test -z "$(git status --porcelain -- ../internal/ui/dist)"
      - name: THIRD_PARTY_LICENSES for the console is current
        run: |
          node licenses.mjs
          git diff --exit-code -- THIRD_PARTY_LICENSES || { echo "::error::web/THIRD_PARTY_LICENSES is out of date; run node licenses.mjs in web/ and then scripts/third-party-licenses.sh"; exit 1; }
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  # The console in a real browser, against the real binary: signing in, creating an inbox,
  # receiving a signed delivery, reading and following it, tokens, settings, maintenance, the
  # command palette, and an accessibility scan (axe) of every screen in both themes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the lockfile
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          # not web/test-results/e2e-data: that is the test server's database
          path: |
            web/playwright-report
            web/test-results
            !web/test-results/e2e-data
          retention-days: 7

  # pkg/server has several hundred tests that run one after another and takes as
  # long as all the rest together, so it runs alongside them, not after them.
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push compares itself with the previous tip of main (see scripts/ci-heavy.sh).
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Do the heavy checks apply to this run?
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/ci-heavy.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test pkg/server
        env:
          RACE: ${{ steps.heavy.outputs.heavy }}
        run: go test -timeout 8m $([ "$RACE" = true ] && echo -race) ./pkg/server/

  # Known vulnerabilities in the code we call, in the standard library we are built
  # with, and in our dependencies. It also runs every night, because a vulnerability is
  # published about code that has not changed.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  docker:
    # Not on a pull request. A push to main gets the heavy checks only if it changed something they read.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push compares itself with the previous tip of main (see scripts/ci-heavy.sh).
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Do the heavy checks apply to this run?
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/ci-heavy.sh
      - name: Build image
        if: steps.heavy.outputs.heavy == 'true'
        run: docker build -t hookinlet:ci .
      - name: Smoke test the image
        if: steps.heavy.outputs.heavy == 'true'
        run: scripts/smoke-docker.sh hookinlet:ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.heavy.outputs.heavy == 'true'
      - name: The image also builds for amd64 and arm64
        if: steps.heavy.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
      - name: Every platform's image carries its healthcheck
        if: steps.heavy.outputs.heavy == 'true'
        run: scripts/check-image-healthcheck.sh "$RUNNER_TEMP/image.tar"

  # The documentation is code too: its examples must run, and the OpenAPI
  # document must be valid (a Go test also checks it against the server).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push compares itself with the previous tip of main (see scripts/ci-heavy.sh).
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Do the heavy checks apply to this run?
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/ci-heavy.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Relative links and anchors in the documentation resolve
        run: go test -count=1 -run TestLinks ./docs
      # Starts servers and runs the examples against them: not for a review.
      - name: Run the examples in the documentation
        if: steps.heavy.outputs.heavy == 'true'
        run: scripts/test-docs.sh
      - name: Lint the OpenAPI document
        env:
          npm_config_ignore_scripts: 'true' # a dependency's install script never runs here
        run: npx --yes @redocly/cli@2.62.1 lint docs/openapi.json

  # A release is only worth tagging if it would work, so check it on every change.
  release-config:
    # Not on a pull request. A push to main gets the heavy checks only if it changed something they read.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Do the heavy checks apply to this run?
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/ci-heavy.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.heavy.outputs.heavy == 'true'
        with:
          go-version-file: go.mod
      - name: Install syft (for the SBOMs)
        if: steps.heavy.outputs.heavy == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.heavy.outputs.heavy == 'true'
        with:
          version: v2.17.0
          args: check
      - name: Build the archives, checksums, and SBOMs (nothing is published)
        if: steps.heavy.outputs.heavy == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean
      - name: Check the archive contents
        if: steps.heavy.outputs.heavy == 'true'
        run: |
          set -e
          cd dist
          sha256sum -c checksums.txt
          ls *.sbom.json | wc -l | grep -qx 4
          # the archive holds one directory, with the binary and the files its documents link to
          for a in hookinlet_*_linux_amd64.tar.gz; do
            dir=${a%.tar.gz}
            tar -tzf "$a" | grep -qx "$dir/hookinlet"
            for f in LICENSE LICENSING.md THIRD_PARTY_LICENSES README.md CODE_OF_CONDUCT.md docs/images/console-overview.png examples/LICENSE; do
              tar -tzf "$a" | grep -qx "$dir/$f" || { echo "::error::$a has no $f"; exit 1; }
            done
          done
